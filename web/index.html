  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API — VL API: единый API для нейросетей</title>
    <meta name="title" content="New API — VL API: единый API для нейросетей" />
    <meta
      name="description"
      content="VL API — единый шлюз к моделям GPT, Claude, Gemini, Grok и DeepSeek. Один API-ключ, прозрачные цены, пополнение баланса и статистика запросов."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://new-api.errorclub.club/" />
    <link rel="ard" href="/.well-known/ard.json" type="application/json" />
    <link
      rel="ai-catalog"
      href="/.well-known/ai-catalog.json"
      type="application/json"
    />

    <meta name="theme-color" content="#020817" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'dark'
        } catch (e) {}
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        } else if (theme !== 'dark' && theme !== 'light') {
          theme = 'dark'
        }
        document.documentElement.classList.add(theme)
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.setAttribute(
            'content',
            theme === 'dark' ? '#020817' : '#fff'
          )
        }
      })()
    </script>

  </head>
